<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — Vanilla HTML</title>
  </head>
  <body>
    <form id="signup-form">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" data-testid="user-email-input" maxlength="64" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" data-testid="user-password-input" />

      <button type="submit" data-testid="btn-submit">Submit</button>
    </form>
  </body>
</html>
