<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — React Controlled Input</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
      .state { margin-top: 1.5rem; padding: 1rem; background: #f1f5f9; border-radius: 0.5rem; }
      .pass { color: #15803d; font-weight: 600; }
      .fail { color: #b91c1c; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>React Controlled Input</h1>
    <p>Phase 1 exit criteria: after Fill Form, <strong>React state</strong> (below) must match the visible input — not just the DOM value.</p>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function SignupForm() {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const domEmail = document.getElementById('email')?.value ?? '';
        const stateMatchesDom = email === domEmail;

        return (
          <form onSubmit={(e) => e.preventDefault()}>
            <label htmlFor="email">Email Address</label>
            <input
              id="email"
              name="email"
              type="email"
              data-testid="user-email-input"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />

            <label htmlFor="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              data-testid="user-password-input"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
            />

            <div className="state">
              <div>React state — email: <code>{email || '(empty)'}</code></div>
              <div>DOM value — email: <code>{domEmail || '(empty)'}</code></div>
              <div className={stateMatchesDom && email ? 'pass' : 'fail'}>
                {stateMatchesDom && email ? 'PASS — framework state synced' : 'FAIL — state not synced yet'}
              </div>
            </div>
          </form>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SignupForm />);
    </script>
  </body>
</html>
